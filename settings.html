<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きせかえ時計 Clock Studio 設定</title>
<script>
/* テーマはちらつかないよう、描画前に決める (既定はダーク) */
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('clockStudio.theme') === 'light' ? 'light' : 'dark'); } catch (e) {}
</script>
<style>
/* 見た目の方針 (案 B「機材・ツール」): OBS や映像編集ソフトのような無彩色のグレー。
 * 差し色は青 1 色で、選択中と主ボタンにだけ使う。影・グラデーション・丸いバッジは使わない。角は 2〜3px。
 * 文字は 13px 以上。主要な操作の高さは 28px 以上。 */

/* ================= 色 (CSS 変数) ================= */
:root {
  color-scheme: dark;
  --bg: #1e1e1e;          /* 画面の地 */
  --panel: #262626;       /* パネル */
  --strip: #2f2f2f;       /* 見出しの帯 */
  --strip-hover: #363636;
  --raised: #303030;      /* ボタンの面・セルのホバー */
  --raised-2: #3a3a3a;    /* ボタンのホバー */
  --press: #282828;       /* ボタンを押している間 */
  --field: #1b1b1b;       /* 入力欄・セルの地 */
  --line: #3a3a3a;        /* パネルの枠・区切り */
  --line-2: #4a4a4a;      /* 部品の枠 */
  --line-3: #5e5e5e;      /* 部品の枠 (ホバー) */
  --box: #7a7a7a;         /* チェックボックスの枠 */
  --text: #dcdcdc;
  --text-2: #b8b8b8;
  --text-3: #9a9a9a;
  --accent: #3574c4;      /* 主ボタン・選択の塗り (白文字で 4.5:1 以上) */
  --accent-hover: #3877c8;
  --accent-mark: #4a8fd8; /* 選択の枠線 */
  --accent-text: #6aa6e6; /* リンク */
  --on-accent: #ffffff;
  --focus: #9cc6f5;       /* キーボードフォーカスの線 (選択の枠より明るい。外側に離して描く) */
  --sel-bg: #263a54;      /* 選択中・オンの塗り (内側の塗り。フォーカスの輪郭とは形で区別する) */
  --warn: #e3b55a;        /* 注意 (おすすめサイズが大きすぎる など) */
  --ok: #6cbf7c;          /* 「コピーしました」などの文字 */
  --ok-soft: #22301f;
  --ok-bg: #2e7a3e;       /* 「コピーしました」のボタンの塗り */
  --ng: #e06c6c;
  --chk-a: #2c2c2c; --chk-b: #222222;   /* 透明の市松 (ステージと同じく、テーマに関係なく暗い) */
  --thumb-bg: #121212;    /* サムネイルの面はテーマに関係なく暗いまま (白文字のデザインが見えるように) */
  --backdrop: rgba(0,0,0,.6);
  /* カラム幅 */
  --lw: 312px;
  --rw: 368px;
  --dcols: 2;
  --th: 62px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #d6d6d6;
  --panel: #ececec;
  --strip: #dcdcdc;
  --strip-hover: #d0d0d0;
  --raised: #e2e2e2;
  --raised-2: #d6d6d6;
  --press: #cbcbcb;
  --field: #ffffff;
  --line: #c2c2c2;
  --line-2: #a8a8a8;
  --line-3: #868686;
  --box: #6e6e6e;
  --text: #1e1e1e;
  --text-2: #3c3c3c;
  --text-3: #5a5a5a;
  --accent: #2f69b3;
  --accent-hover: #2a5fa3;
  --accent-mark: #2f69b3;
  --accent-text: #24569a;
  --on-accent: #ffffff;
  --focus: #0a66e0;
  --sel-bg: #cfdff4;
  --warn: #8a5300;
  --ok: #2b7139;
  --ok-soft: #dcebdc;
  --ok-bg: #2e7a3e;
  --ng: #b42318;
  --thumb-bg: #161616;
  --backdrop: rgba(0,0,0,.42);
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo UI', 'Meiryo', sans-serif; font-size: 13px; line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, input:disabled, select:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: #3574c4; color: #fff; }
* { scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: inline-flex; line-height: 0; flex: none; }
.ic svg { display: block; }
/* 小さな線画アイコンはツールバー的なボタン (見出しの帯・コピー・検索) にだけ出す */
.link .ic, .rs .ic, .chip .ic, .pillbtn .ic, .btn.small .ic, .btn.primary .ic { display: none; }
.col-head .btn.small .ic { display: inline-flex; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= 1 画面のアプリ構成 (幅 1000px 以上) ================= */
@media (min-width: 1000px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .app { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
}

/* ================= ヘッダー: メニューバー風の細い帯 ================= */
.top { flex: none; display: flex; align-items: center; gap: 6px 12px; padding: 3px 8px; min-height: 36px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: none; }
.logo { width: 22px; height: 22px; border-radius: 2px; background: var(--raised-2); color: var(--text); display: flex; align-items: center; justify-content: center; flex: none; }
.logo svg { width: 15px; height: 15px; }
.brand h1 { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; line-height: 1.25; font-weight: 600; white-space: nowrap; }
.brand h1 small { font-size: 13px; font-weight: 400; color: var(--text-3); }
.badge { flex: none; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--raised); color: var(--text-2); font-size: 13px; line-height: 20px; white-space: nowrap; }
.hint { flex: 0 1 auto; min-width: 0; margin: 0 auto 0 4px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; border-left: 1px solid var(--line); font-size: 13px; color: var(--text-3); }
.hint[hidden] { display: none; }
.hint .ht, .hint .ht-s, .hint .ht-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint .ht-s, .hint .ht-n { display: none; }   /* 狭い幅用の短いヒント */
.hint b { color: var(--text); font-weight: 600; }
.hint .x { flex: none; width: 28px; height: 28px; border: 0; border-radius: 2px; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
.hint .x svg { width: 13px; height: 13px; }
.hint .x:hover { background: var(--raised-2); color: var(--text); }
.top .tbtns { margin-left: auto; display: flex; gap: 2px; flex: none; }
.hint:not([hidden]) + .tbtns { margin-left: 0; }
.pillbtn { display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px; border: 1px solid transparent; border-radius: 2px; background: transparent; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.pillbtn:hover { background: var(--raised); border-color: var(--line-2); color: var(--text); }
/* 画面の言語 (右上) */
.langbox { position: relative; display: inline-flex; align-items: center; color: var(--text-2); }
.langbox .ic { position: absolute; left: 8px; pointer-events: none; display: inline-flex; }
.langbox select { min-height: 28px; padding: 2px 6px 2px 28px; border-color: transparent; background: transparent; color: var(--text-2); font-size: 13px; cursor: pointer; }
.langbox select:hover { background: var(--raised); border-color: var(--line-2); color: var(--text); }
.langbox select option { background: var(--panel); color: var(--text); }

/* ================= 3 カラム: ドッキングしたパネル ================= */
.app { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); gap: 4px; padding: 4px; }
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }
.col-design, .col-adjust { overflow: hidden; }
/* カラムの見出し: 濃いグレーの細い帯 */
.col-head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 4px 0 10px; background: var(--strip); border-bottom: 1px solid var(--line); }
.col-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.3; font-weight: 600; white-space: nowrap; }
.col-head .sub { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.col-head .end { margin-left: auto; }
/* ①②③ は数字 + 区切り線 (バッジにしない) */
.num { flex: none; display: inline-flex; align-items: center; padding-right: 8px; border-right: 1px solid var(--line-2); color: var(--text-3); font-size: 13px; font-weight: 600; line-height: 14px; }

/* ================= ボタン・入力 ================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 28px; padding: 3px 12px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--raised); color: var(--text); line-height: 1.4; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--raised-2); border-color: var(--line-3); }
.btn:active:not(:disabled) { background: var(--press); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--focus); }
.btn.primary.done, .btn.primary.done:hover:not(:disabled) { background: var(--ok-bg); border-color: var(--ok-bg); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--raised); border-color: var(--line-2); color: var(--text); }
.btn.small { min-height: 28px; padding: 1px 9px; font-size: 13px; }
.btn.icon { padding: 3px 6px; }
.btn:disabled { opacity: .4; }
.link { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 1px 4px; border: 0; border-radius: 2px; background: transparent; color: var(--accent-text); font-size: 13px; text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }
select, input[type=text], input[type=number], input[type=search] { max-width: 100%; min-height: 28px; padding: 2px 7px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); font-size: 13px; }
select:hover, input[type=text]:hover, input[type=number]:hover, input[type=search]:hover { border-color: var(--line-3); }
select:focus, input[type=text]:focus, input[type=number]:focus, input[type=search]:focus { border-color: var(--accent-mark); outline: none; }
select:focus-visible, input[type=text]:focus-visible, input[type=number]:focus-visible, input[type=search]:focus-visible { box-shadow: inset 0 0 0 1px var(--accent-mark); }
input::placeholder, textarea::placeholder { color: var(--text-3); opacity: 1; }
input[type=number] { width: 64px; font-variant-numeric: tabular-nums; }
input[type=range] { min-width: 0; accent-color: var(--accent-mark); }
input[type=color] { -webkit-appearance: none; appearance: none; flex: none; width: 34px; height: 28px; padding: 2px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 1px solid rgba(128,128,128,.35); border-radius: 1px; }
/* オン / オフ: 四角いチェックボックス */
.sw-toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; cursor: pointer; user-select: none; }
.sw-toggle input { -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 15px; height: 15px; margin: 0; border: 1px solid var(--box); border-radius: 2px; background: var(--field); cursor: pointer; }
.sw-toggle input:checked { background: var(--accent); border-color: var(--accent); }
.sw-toggle input:checked::after, .tg[aria-pressed="true"] .tsw::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.sw-toggle:hover input:not(:disabled):not(:checked) { border-color: var(--text-2); }
.sw-toggle input:disabled { opacity: .4; }
/* セグメント: つながった四角いボタン列。選択は青ベタ */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); }
.seg button { min-height: 28px; padding: 2px 11px; border: 0; border-left: 1px solid var(--line-2); background: transparent; color: var(--text-2); }
.seg button:first-child { border-left: 0; }
.seg button:hover:not(:disabled) { background: var(--raised); color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
/* 折り返す選択肢 (日付の書き方・系統・配色・フォントなど): セルを 1px ずつ重ねたグリッド */
.opts, .chips, .pals, .fonts { padding: 1px 0 0 1px; }
.opts { display: flex; flex-wrap: wrap; }
.opts button { min-height: 28px; margin: -1px 0 0 -1px; padding: 2px 9px; border: 1px solid var(--line-2); border-radius: 0; background: var(--field); color: var(--text-2); font-size: 13px; }
.opts button:hover:not(:disabled) { background: var(--raised); color: var(--text); }
.opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.quick { display: flex; flex-wrap: wrap; align-items: center; width: 100%; margin-top: 6px; padding-left: 1px; }
.pbtn { min-height: 28px; margin-left: -1px; padding: 1px 10px; border: 1px solid var(--line-2); border-radius: 0; background: var(--field); color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.pbtn:first-child { border-radius: 2px 0 0 2px; }
.pbtn:last-child { border-radius: 0 2px 2px 0; }
.pbtn:hover:not(:disabled) { background: var(--raised); color: var(--text); }
.pbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
/* 重ねたセルは、選択中・フォーカス中のものを前に出して枠が隣に隠れないようにする */
.opts button[aria-pressed="true"], .pbtn[aria-pressed="true"], .chip[aria-pressed="true"], .pal[aria-pressed="true"], .fbtn[aria-pressed="true"] { position: relative; z-index: 1; }
.opts button:focus-visible, .pbtn:focus-visible, .chip:focus-visible, .pal:focus-visible, .fbtn:focus-visible, .seg button:focus-visible { position: relative; z-index: 2; }

/* ================= ① デザイン (左カラム) ================= */
.dtools { flex: none; display: flex; flex-direction: column; gap: 5px; padding: 6px; border-bottom: 1px solid var(--line); }
.srow { display: flex; gap: 4px; }
.rndbtn { flex: none; padding: 1px 8px; }
.rndbtn .ic svg, .col-head .btn .ic svg { width: 13px; height: 13px; }
.col-head .btn.small { padding: 0 7px; background: transparent; border-color: transparent; }
.col-head .btn.small:hover:not(:disabled) { background: var(--raised); border-color: var(--line-2); }
.search { position: relative; flex: 1 1 auto; min-width: 0; }
.search .ic { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .ic svg { width: 13px; height: 13px; }
.search input { width: 100%; padding-left: 26px; }
/* 系統のしぼり込み: 角ばったタブのグリッド */
.chips { display: flex; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; margin: -1px 0 0 -1px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 0; background: var(--field); color: var(--text-2); font-size: 13px; line-height: 1; }
.chip:hover { background: var(--raised); color: var(--text); }
.chip small { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.chip[aria-pressed="true"] small { color: var(--on-accent); }
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 18px; font-size: 13px; color: var(--text-3); }
.dmeta > * { white-space: nowrap; }
.dmeta .onlyfree { margin-left: auto; min-height: 28px; color: var(--text-2); }
.dlist { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 6px 8px; }
.dgroup + .dgroup { margin-top: 6px; }
.ghead { position: sticky; top: 0; z-index: 3; display: flex; align-items: baseline; gap: 8px; margin: 0 -6px 4px; padding: 3px 8px; background: var(--strip); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--text); }
.ghead small { font-size: 13px; font-weight: 400; color: var(--text-3); }
.dgrid { display: grid; grid-template-columns: repeat(var(--dcols), minmax(0, 1fr)); gap: 4px; }
/* デザインのカード: 枠なしのタイル。選択は青の枠 2px + 左上のチェック */
.card { position: relative; min-width: 0; }
.card .pick { display: block; width: 100%; padding: 2px; border: 0; border-radius: 2px; background: transparent; color: var(--text); text-align: left; }
.card .pick:hover { background: var(--raised); }
.card .thumb { position: relative; display: flex; align-items: center; justify-content: center; height: var(--th); border-radius: 1px; overflow: hidden; background: var(--thumb-bg); }
.card .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; padding: 6px 8px; }
.card .thumb .alt { display: none; padding: 0 6px; color: #cfcfcf; font-size: 13px; font-weight: 600; text-align: center; }
.card.nothumb .thumb img { display: none; }
.card.nothumb .thumb .alt { display: block; }
.card .nm { display: block; padding: 2px 2px 1px; font-size: 13px; line-height: 1.35; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.on .pick, .card.on .pick:hover { background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--accent-mark); }
.card .pick:focus-visible { position: relative; z-index: 2; outline: 2px solid var(--focus); outline-offset: 2px; }
.card.on .nm { color: var(--text); font-weight: 600; }
/* 試し表示中 (マウスを乗せている): 灰色の枠 */
.card.trial .pick { background: var(--raised); box-shadow: inset 0 0 0 1px var(--box); }
.card.on.trial .pick { box-shadow: inset 0 0 0 1px var(--accent-mark); }
.card .sel { position: absolute; left: 4px; top: 4px; display: none; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 1px; background: var(--accent); color: var(--on-accent); pointer-events: none; }
.card .sel svg { width: 11px; height: 11px; }
.card.on .sel { display: flex; }
.card .fav { position: absolute; right: 4px; top: 4px; z-index: 3; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid #555; border-radius: 2px; background: rgba(20,20,20,.85); color: #dcdcdc; opacity: 0; }
.card .fav svg { width: 13px; height: 13px; }
.card .fav:hover { background: #3a3a3a; }
.card:hover .fav, .card:focus-within .fav, .card .fav[aria-pressed="true"] { opacity: 1; }
.card .fav[aria-pressed="true"] { color: #ffffff; }
.card .fav[aria-pressed="true"] svg { fill: currentColor; }
@media (hover: none) { .card .fav { opacity: 1; } }
/* 無料版で使えないデザイン: 鍵の札 + サムネイルを暗く */
.card .lockmark, .paid-img .lockmark { position: absolute; display: none; align-items: center; gap: 4px; padding: 1px 6px; border: 1px solid #555; border-radius: 2px; background: rgba(20,20,20,.88); color: #dcdcdc; font-size: 13px; white-space: nowrap; }
.card .lockmark { right: 3px; top: 3px; padding: 3px; }
.card .lockmark .lt { display: none; }   /* カードでは鍵だけ (文字つきの札は時計の数字を隠すため)。名前の横に出す */
.card.locked .nm::after { content: var(--locked-sfx, ' ・有料版'); }
.card .lockmark svg, .paid-img .lockmark svg { width: 12px; height: 12px; }
.card.locked .lockmark { display: inline-flex; }
.card.locked .thumb img { opacity: .75; }
.card.locked .nm { color: var(--text-3); }
.card.locked .pick:hover .thumb img { opacity: .8; }
.card.flash .pick { animation: flash .7s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 4px var(--accent-mark); } 100% { box-shadow: inset 0 0 0 1px var(--accent-mark); } }
.empty { padding: 24px 6px; color: var(--text-2); font-size: 13px; text-align: center; }
.empty .btn { margin-top: 10px; }

/* ================= 中央: プレビュー ================= */
.col-center { display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.pvpanel { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage"; overflow: hidden; }
.pvtop { grid-area: top; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px 0 10px; background: var(--strip); border-bottom: 1px solid var(--line); }
.pvtop .lbl { font-size: 13px; color: var(--text-3); white-space: nowrap; }
.pvtop .dn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.pvtop .pos { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.frametgl { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; white-space: nowrap; }
.frametgl:hover { color: var(--text); }
.frametgl .ft-s { display: none; }
.frametgl input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent-mark); cursor: pointer; }
/* ステージ (プレビューの面) はテーマに関係なく暗い */
.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; background-color: #111; background-size: cover; background-position: center; }
.stage .frame { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.stage.showframe .frame { outline: 1.5px dashed rgba(110,165,230,.95); }
/* 親の color-scheme (dark) と時計側 (light) が違うと iframe が不透明 (白) になるので、iframe 要素は時計側に合わせる */
iframe { color-scheme: light; }
.stage iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
.stage .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; align-items: center; justify-content: center; width: 28px; height: 44px; border: 1px solid #4a4a4a; border-radius: 2px; background: rgba(38,38,38,.85); color: #e6e6e6; }
.stage .nav svg { width: 16px; height: 16px; }
.stage .nav:hover:not(:disabled) { background: #3a3a3a; border-color: #7a7a7a; }
.stage .nav:disabled { opacity: .3; }
.stage .nav.prev { left: 6px; }
.stage .nav.next { right: 6px; }
.stage .scale { position: absolute; right: 6px; bottom: 6px; z-index: 3; display: none; padding: 1px 8px; border-radius: 2px; background: rgba(30,30,30,.85); color: #dcdcdc; font-size: 13px; }
.stage .scale.on { display: block; }
.stage .trialtag { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 8px; padding: 2px 10px; border: 1px solid #555; border-radius: 2px; background: rgba(30,30,30,.92); color: #dcdcdc; font-size: 13px; white-space: nowrap; }
.stage .trialtag b { color: #ffffff; font-weight: 600; }
.stage .trialtag small { color: #a8a8a8; font-size: 13px; }
.stage.trial .trialtag { display: inline-flex; }
/* 通知 (トースト): ステージの下に出る暗い札 */
.stage .toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 4px 12px; width: max-content; max-width: calc(100% - 24px); padding: 4px 6px 4px 12px; border: 1px solid #6a6a6a; border-radius: 2px; background: rgba(30,30,30,.96); color: #e6e6e6; font-size: 13px; line-height: 1.4; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .2s, visibility .2s; }
.stage .toast .tm { min-width: 0; padding: 3px 0; }
.stage .toast:not(.act) { padding-right: 12px; }
.stage .toast.on { visibility: visible; opacity: 1; pointer-events: auto; }
.stage .toast .tact { flex: none; min-height: 28px; padding: 2px 10px; border: 1px solid #7a7a7a; border-radius: 2px; background: #3a3a3a; color: #ffffff; font-weight: 600; white-space: nowrap; }
.stage .toast .tact:hover { background: #4a4a4a; border-color: #9a9a9a; }

/* プレビューの背景 (暗い無彩色で固定) */
.bg-dark { background: #161616; }

/* ================= 中央下: ③ OBS に入れる ================= */
.obsbar { min-width: 0; padding: 0 0 6px; }
.obs-h { display: flex; align-items: center; gap: 6px 10px; min-height: 30px; padding: 0 8px 0 10px; background: var(--strip); border-bottom: 1px solid var(--line); }
.obs-h h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.obs-h .links { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 10px; }
.obs-h .link { min-height: 28px; }
.obs-h .link .lt-s { display: none; }   /* 狭い幅用の短い文言 */
.obs-row { display: flex; align-items: center; gap: 8px; min-width: 0; margin: 6px 8px 0 10px; }
.copybtn { flex: none; min-width: 150px; min-height: 32px; padding: 5px 18px; font-size: 14px; }
.copybtn .ic svg { width: 15px; height: 15px; }
.sizebox { flex: none; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.sizebox button { min-height: 28px; padding: 1px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); color: var(--text); font-family: Consolas, 'Segoe UI', monospace; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sizebox button:hover { border-color: var(--accent-mark); }
.sizebox .x { color: var(--text-3); }
/* 数字をクリックでコピーしたとき */
.sizebox button.copied-now, .copied-now { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; }
.urltext { flex: 1 1 auto; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, 'Courier New', monospace; color: var(--text-2); }
.urltext:focus { color: var(--text); }
.openbtn { min-height: 28px; }
/* メッセージは 2 行ぶんの高さを最初から取っておく (コピー後に行が増えても周りが動かない) */
.obs-msg { height: 36px; margin: 4px 8px 0 10px; overflow: hidden; font-size: 13px; line-height: 18px; color: var(--text-3); }
.obs-msg .nw { white-space: nowrap; }
.obs-msg.warn { color: var(--warn); font-weight: 600; }
.sizebox.over button { border-color: var(--warn); color: var(--warn); }
.obs-msg.ok { color: var(--ok); font-weight: 600; }
.obs-msg.ng { color: var(--ng); }
/* 無料版: コピー後のクレジット案内 (帯の中に静かに出す) */
.credit { margin: 4px 8px 0 10px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); font-size: 13px; line-height: 18px; color: var(--text-2); }
.credit[hidden] { display: none; }
.credit .cr-h { display: flex; align-items: flex-start; gap: 8px; color: var(--text); font-weight: 600; }
.credit .cr-h span { flex: 1 1 auto; min-width: 0; }
.credit .cr-body { display: flex; align-items: flex-start; gap: 8px; margin-top: 4px; }
.credit .cr-text { flex: 1 1 auto; min-width: 0; margin: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 2px; background: var(--bg); color: var(--text); font: 12px/17px Consolas, 'Courier New', monospace; white-space: pre-wrap; word-break: break-all; user-select: all; }
.credit .cr-body .btn { flex: none; }
.credit .cr-foot { margin-top: 4px; font-size: 12px; color: var(--text-3); }
.credit .cr-foot a { color: var(--accent-text); }
@media (max-width: 999px) { .credit .cr-body { flex-wrap: wrap; } .credit .cr-body .btn { width: 100%; } }

/* ================= ② 好みに調整 (右カラム) ================= */
.adj { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.sec { padding: 0 10px 10px; }
/* 区切りの見出し: 細い帯 */
.sec-h { display: flex; align-items: center; gap: 8px; min-height: 26px; margin: 0 -10px 8px; padding: 3px 10px; background: var(--strip); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.sec:first-child .sec-h { border-top: 0; }
.sec-h .sub { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--text-3); white-space: nowrap; }
/* 無料版で固定の区切りの注記 */
.locknote { display: flex; align-items: center; gap: 6px; margin: -2px 0 8px; padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--raised); color: var(--text-2); font-size: 13px; }
.locknote svg { width: 13px; height: 13px; }
.locknote a { margin-left: auto; color: var(--accent-text); font-weight: 600; white-space: nowrap; }
/* 秒・日付・12 時間表示: つながったトグルボタン (チェックボックス付き) */
.tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); }
.tg { position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 30px; padding: 2px 6px; border: 0; border-left: 1px solid var(--line-2); border-radius: 0; background: transparent; color: var(--text-2); font-size: 13px; line-height: 1.2; white-space: nowrap; }
.tg:first-child { border-left: 0; }
.tg:hover:not(:disabled) { background: var(--raised); color: var(--text); }
.tg:focus-visible { z-index: 2; }
.tg .tsw { position: relative; flex: none; order: -1; width: 15px; height: 15px; border: 1px solid var(--box); border-radius: 2px; background: var(--field); }
.tg[aria-pressed="true"] { background: var(--sel-bg); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent-mark); }
.tg[aria-pressed="true"] .tsw { background: var(--accent); border-color: var(--accent); }
.tg:disabled { opacity: .4; }
.tg .cdot { position: absolute; right: 3px; top: 3px; }
.tnote { margin-top: 5px; font-size: 13px; color: var(--text-3); }
.tnote:empty { display: none; }
/* 変えた項目の印: 小さな青い四角 */
.cdot { flex: none; display: none; width: 6px; height: 6px; background: var(--accent-mark); }
.changed > .it-h .cdot, .tg.changed .cdot, .more.changed > summary .cdot { display: inline-block; }
.it { margin-top: 8px; }
.it:first-child { margin-top: 0; }
.it[hidden] { display: none; }
.it-h { display: flex; align-items: center; gap: 6px; min-height: 20px; margin-bottom: 3px; font-size: 13px; font-weight: 600; }
.it-h .hint2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 400; color: var(--text-3); }
.it-h .rs { flex: none; display: none; align-items: center; gap: 4px; min-height: 28px; margin: -4px 0 -4px auto; padding: 1px 6px; border: 0; border-radius: 2px; background: transparent; color: var(--accent-text); font-size: 13px; font-weight: 400; }
.it-h .rs:hover { background: var(--raised); }
.changed > .it-h .rs { display: inline-flex; }
.it.nolabel:not(.changed) > .it-h { display: none; }   /* 見出しなしの項目: 変えたときだけ「元に戻す」の行を出す */
.it.nolabel > .it-h { justify-content: flex-end; }
.it-c { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.it-c > div[style], .it-c > p { font-size: 13px; }
/* 使えない項目 (無料版で固定・このデザインでは使えない): 部品を薄く + 理由の 1 行 */
.it-off { display: none; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--text-3); }
.it-off svg { width: 13px; height: 13px; }
.it.off > .it-off { display: flex; }
.it.off > .it-c { opacity: .4; }
.it.off > .it-h { color: var(--text-2); }
.it.off > .it-h .rs { display: none; }
/* このデザインで変えられない項目のまとめ (くわしい設定の先頭に 1 行) */
.supnote { display: flex; align-items: flex-start; gap: 6px; margin: 0 0 10px; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 2px; color: var(--text-2); font-size: 13px; }
.opts button:disabled, .seg button:disabled { opacity: .4; }
.partnote { margin: 6px 0 0; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 2px; color: var(--text-2); font-size: 13px; }
.partnote[hidden] { display: none; }
.supnote[hidden] { display: none; }
.subs { margin: 6px 0 0 2px; padding-left: 10px; border-left: 1px solid var(--line-2); }
.subs .it { margin-top: 8px; }
.subs .it:first-child { margin-top: 0; }
.subs:empty, .subs.none { display: none; }
.labelin { flex: 1 1 auto; min-width: 0; }
.cnt { flex: none; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* 色: おすすめ配色はコンパクトなリスト */
.pals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.pal { display: flex; align-items: center; gap: 6px; min-width: 0; height: 28px; margin: -1px 0 0 -1px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 0; background: var(--field); text-align: left; }
.pal:hover:not(:disabled) { background: var(--raised); }
.pal[aria-pressed="true"] { border-color: var(--accent-mark); box-shadow: inset 0 0 0 1px var(--accent-mark); background: var(--raised); }
.pal .dots { display: flex; flex: none; }
.pal .dots span { width: 12px; height: 12px; margin-left: 2px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
:root[data-theme="light"] .pal .dots span { box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.pal .dots span:first-child { margin-left: 0; }
.pal .pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
details.fold { margin-top: 6px; }
details.fold > summary, details.more > summary { display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; user-select: none; }
details.fold > summary::-webkit-details-marker, details.more > summary::-webkit-details-marker { display: none; }
details.fold > summary { min-height: 28px; padding: 2px 0; font-size: 13px; color: var(--text-2); }
details.fold > summary:hover { color: var(--text); }
.chev { flex: none; width: 6px; height: 6px; margin: 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(45deg); }
details.fold .fold-in { padding: 6px 0 2px 2px; }
.hexin { width: 92px !important; font-family: Consolas, 'Courier New', monospace; text-transform: lowercase; }
.hexin[aria-invalid="true"] { border-color: var(--ng); }

/* フォント: 罫のグリッド。名前は 2 行まで折り返して省略しない */
.fonts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.fbtn { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-width: 0; margin: -1px 0 0 -1px; padding: 3px 3px 3px; border: 1px solid var(--line-2); border-radius: 0; background: var(--field); color: var(--text); text-align: center; }
.fbtn[hidden] { display: none; }
.fbtn:hover:not(:disabled) { background: var(--raised); }
.fbtn[aria-pressed="true"] { border-color: var(--accent-mark); box-shadow: inset 0 0 0 1px var(--accent-mark); background: var(--raised); }
.fbtn .smp { display: block; max-width: 100%; overflow: hidden; font-size: 19px; line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fbtn .fn { display: block; max-width: 100%; font-size: 13px; line-height: 1.25; letter-spacing: -.02em; color: var(--text-3); text-wrap: balance; overflow-wrap: break-word; }
.fbtn .fn .fnp { display: inline-block; }   /* 標準の「(フォント名)」は途中で切らずに 2 行目へ */
.fbtn.def .fn { color: var(--text-2); }
.fbtn[aria-pressed="true"] .fn { color: var(--text); }
.fmore { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
.fmore.btn.ghost { padding-left: 0; color: var(--accent-text); }
.fmore.btn.ghost:hover:not(:disabled) { padding-left: 6px; }

/* 大きさ */
.rangebox { display: flex; align-items: center; gap: 8px; width: 100%; }
.rangebox input[type=range] { flex: 1 1 auto; }
.rangebox .unit { margin-left: -4px; color: var(--text-2); }

/* くわしい設定 (開閉する帯) */
details.more > summary { white-space: nowrap; min-height: 28px; padding: 3px 10px; background: var(--strip); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
details.more > summary:hover { background: var(--strip-hover); }
details.more > summary .sub { min-width: 0; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 400; color: var(--text-3); }
details.more .more-in { padding: 8px 10px 10px; }
.posbox { display: flex; align-items: center; gap: 12px; }
/* 表示位置: OBS の枠を模した 3×3 */
.obsframe { position: relative; flex: none; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; width: 150px; height: 98px; padding: 3px; border: 1px dashed var(--box); background: var(--field); }
.obsframe button { display: flex; min-height: 28px; padding: 0; border: 0; border-radius: 0; background: transparent; }
.obsframe button span { width: 6px; height: 6px; margin: auto; background: var(--line-3); }
.obsframe button:hover:not(:disabled) { background: var(--raised); }
.obsframe button:hover:not(:disabled) span { background: var(--text-2); }
.obsframe button[aria-pressed="true"] span { width: 36px; height: 16px; background: var(--accent-mark); }
.obsframe button.l span { margin-left: 3px; }
.obsframe button.r span { margin-right: 3px; }
.obsframe button.t span { margin-top: 3px; }
.obsframe button.b span { margin-bottom: 3px; }
.posinfo { min-width: 0; font-size: 13px; color: var(--text-3); }
.posinfo b { display: block; font-size: 13px; color: var(--text); }
.tzsel { width: 100%; }
.resetall { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.resetall .note { font-size: 13px; color: var(--text-3); }
.resetall .btn .ic { display: none; }

/* ================= ダイアログ ================= */
dialog { max-width: min(480px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line-3); border-radius: 3px; background: var(--panel); color: var(--text); }
dialog::backdrop { background: var(--backdrop); }
.dlg-in { padding: 14px 16px; }
dialog h3 { margin: 0 0 8px; padding-right: 32px; font-size: 15px; font-weight: 600; }
dialog h3:focus { outline: none; }
dialog p { color: var(--text-2); font-size: 13px; }
dialog .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin: 14px -16px -14px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--strip); }
.dlg-x { position: absolute; right: 6px; top: 6px; z-index: 2; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: 2px; background: transparent; color: var(--text-2); }
.dlg-x:hover { background: var(--raised-2); color: var(--text); }
/* 有料版の案内 */
.paid-img { position: relative; display: flex; align-items: center; justify-content: center; height: 150px; margin: 0 0 12px; overflow: hidden; border: 1px solid var(--line); background: var(--thumb-bg); }
.paid-img img { display: block; width: 100%; height: 100%; padding: 14px 18px; object-fit: contain; }
.paid-img .lockmark { right: 6px; top: 6px; display: inline-flex; }

/* 大きく並べて選ぶ */
dialog.gal { width: min(1600px, calc(100vw - 24px)); max-width: none; height: calc(100vh - 24px); max-height: none; }
dialog.gal[open] { display: flex; flex-direction: column; }
.gal-h { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 48px 6px 12px; background: var(--strip); border-bottom: 1px solid var(--line); }
.gal-h h3 { margin: 0; padding: 0; font-size: 13.5px; white-space: nowrap; }
.gal-h .search { flex: 0 1 300px; }
.gal-h .chips { flex: 1 1 100%; }
.gal-h .chip { padding: 0 10px; }
.gal-h .dmeta { flex: 1 1 100%; }
.gal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 8px 10px; }
.gal-body .ghead { margin: 0 -8px 4px; padding: 3px 10px; }
.gal-body .dgrid { grid-template-columns: repeat(auto-fill, minmax(max(210px, calc((100% - 20px) / 6)), 1fr)); gap: 4px; }
.gal-body .card .thumb { height: 120px; }
.gal-body .card .thumb img { padding: 10px 14px; }
.gal-body .card .nm { padding: 3px 3px 2px; }
.gal-body .card .lockmark { right: 6px; top: 6px; }

/* OBS への入れ方 */
dialog.howto { width: min(940px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 32px); }
dialog.howto[open] { display: flex; flex-direction: column; }
dialog.howto .dlg-in { overflow-y: auto; padding: 14px 16px 14px; }
dialog.howto .acts { position: sticky; bottom: -14px; }
.howto h4 { margin: 14px 0 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--strip); font-size: 13.5px; font-weight: 600; }
.howto .lead { margin: 0 0 12px; color: var(--text-2); }
.obswrap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
/* OBS の画面を模した図 (テーマに関係なく OBS と同じ暗いグレー) */
.mock { flex: 0 1 410px; min-width: 280px; color: #e6e6e6; font-size: 14px; }
.mock .win { overflow: hidden; border: 1px solid #4a4a4a; border-radius: 2px; background: #2b2b2b; }

/* 手順: 四角い番号 + 押す場所の名前はキー風の枠 */
.proc { flex: 1 1 280px; min-width: 0; }
.proc ol { margin: 0; padding: 0; list-style: none; counter-reset: p; }
.proc li { position: relative; padding: 1px 0 10px 34px; counter-increment: p; font-size: 13px; }
.proc li::before { content: counter(p); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 2px; background: var(--raised-2); color: var(--text); font-size: 13px; font-weight: 600; line-height: 22px; text-align: center; }
.proc li.done::before { content: '\2713'; background: var(--ok-bg); color: #fff; }
.proc li .donetag { display: none; margin-left: 6px; padding: 0 6px; border: 1px solid var(--ok); border-radius: 2px; color: var(--ok); font-size: 13px; font-weight: 600; white-space: nowrap; }
.proc li.done .donetag { display: inline-block; }
.proc .nw { white-space: nowrap; }
.proc li b { padding: 0 5px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); color: var(--text); font-weight: 600; }
.sizecard { margin-top: 2px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); font-size: 13px; }
.sizecard .nums { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0; }
.sizecard .nums button { min-height: 30px; padding: 2px 10px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--panel); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sizecard .nums button:hover { border-color: var(--accent-mark); }
.sizecard .nums .x { color: var(--text-3); }
.sizecard .note { font-size: 13px; color: var(--text-2); }
.trouble details { border-top: 1px solid var(--line); }
.trouble details:first-of-type { border-top: 0; }
.trouble summary { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 4px 0; font-size: 13px; font-weight: 600; list-style: none; cursor: pointer; }
.trouble summary:hover { color: var(--text); background: var(--raised); }
.trouble summary::-webkit-details-marker { display: none; }
.trouble summary::before { content: ''; flex: none; width: 6px; height: 6px; margin-left: 4px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); transition: transform .15s; }
.trouble details[open] summary::before { transform: rotate(45deg); }
.trouble details p { margin: 0 0 10px; padding-left: 20px; color: var(--text-2); font-size: 13px; }

.import textarea { width: 100%; height: 80px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--field); color: var(--text); font-family: Consolas, monospace; font-size: 13px; resize: vertical; }
.import textarea:hover { border-color: var(--line-3); }

.msg { min-height: 1.4em; margin-top: 6px; font-size: 13px; }

.usage li b { display: block; font-weight: 600; }

<script>
(function () {

var CS = window.ClockStudio, D = CS.DEFAULTS;

 * 画面の言語 (uiLang): localStorage (LG.STORE_KEY) → 無ければ navigator.languages から detect。右上で切り替え (保存して reload)。
 * 時計の言語 (cfg.lang): clock-data.js の DEFAULTS に lang があるときだけ「時計の言葉」を出す (feature detect)。

var LG = window.ClockStudioLang || fallbackLang();
var LANG_KEY = LG.STORE_KEY || 'clockStudio.lang.v1';
var uiLang = (function () {
  var s = lsGet(LANG_KEY);
  if (LG.has(s)) return s;
  var nl = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  var d = LG.detect(nl);
  if (!LG.has(d)) d = LG.DEFAULT;

  return d;
})();
var HAS_LANG = !LG.fallback && Object.prototype.hasOwnProperty.call(D, 'lang');   /* 時計側が lang に対応しているか */
function T(key, vars) { return LG.t(uiLang, key, vars); }
function langInfo(id) { for (var i = 0; i < LG.LANGS.length; i++) if (LG.LANGS[i].id === id) return LG.LANGS[i]; return LG.LANGS[0]; }

function gName(g) { return LG.groupName(uiLang, g); }

function clockLang() { return HAS_LANG && LG.has(cfg.lang) ? cfg.lang : 'ja'; }

function fixClockLang(old) {
  var C = LG.C(clockLang());
  if (old && old !== clockLang() && cfg.df === LG.C(old).dfDefault) cfg.df = C.dfDefault;

var toastTimer = 0;
/* act: { label, fn } を渡すと、ボタンつきで長めに出す */

/* デザインの個性は色と書体で決まるので、切り替えたら色 (c1〜c3) とフォントはそのデザインの標準に戻す */

/* ---------- プレビュー ---------- */
var pv = $('pv');
function sendConfig(q) {
  if (!ready) return;
  lastSendAt = Date.now();
  try { pv.contentWindow.postMessage({ type: 'clock-studio:config', query: q }, '*'); } catch (e) {}
}
window.addEventListener('message', function (e) {
  var m = e.data;
  if (!m || typeof m !== 'object' || e.source !== pv.contentWindow) return;   // メインのプレビューからのものだけ
  if (m.type === 'clock-studio:ready') { ready = true; sendConfig(trialId ? trialQuery(trialId) : queryNow()); }
  else if (m.type === 'clock-studio:size' && m.w > 0 && m.h > 0 && isFinite(m.w) && isFinite(m.h)) {
    /* clock.html は設定を受けてから 80ms 後に大きさを送る。送ってから 70ms 以内に届いたものは 1 つ前の設定のもの */
    if (Date.now() - lastSendAt < 70) return;
    var sz = { w: Math.min(+m.w, 5000), h: Math.min(+m.h, 5000) };
    if (trialId) { trialMeasured = sz; layoutPreview(); return; }   // 試し表示中は推奨サイズを変えない
    /* 時計の幅は時刻の数字 (「1」の数) で毎秒少し変わる。設定が同じあいだは大きい方を保つ (数字がちらつかず、枠が小さすぎにならない) */
    var q = queryNow();
    if (measured && measuredQ === q) sz = { w: Math.max(sz.w, measured.w), h: Math.max(sz.h, measured.h) };
    measured = sz; measuredQ = q;
    layoutPreview();
    for (var i = 0; i < sizeSyncers.length; i++) sizeSyncers[i]();
  }
});
/* 推奨サイズ: 実寸 + 余白 を 10px 単位に切り上げ。実寸が届かないうちは rec × size% */
function recFor(d, m) {
  if (m) return [ceil10(m.w + MARGIN * 2), ceil10(m.h + MARGIN * 2), true];
  var r = (d && d.rec) || { v: [400, 160], h: [550, 130] };
  var s = d && d.supports || {};
  var base = ((cfg.lay === 'h' || cfg.lay === 'hr') && s.lay !== false) ? r.h : r.v;
  return [Math.round(base[0] * cfg.size / 100), Math.round(base[1] * cfg.size / 100), false];
}
function recSize() { return recFor(curDesign(), measured); }
function layoutPreview() {
  var sz = trialId ? recFor(CS.design(trialId), trialMeasured) : recSize();
  var st = $('stage');
  var w = sz[0], hh = sz[1];
  var side = st.clientWidth > 520 ? 112 : 84;   // 左右の ◀ ▶ の分をあける
  var s = Math.min(1, (st.clientWidth - side) / w, (st.clientHeight - 24) / hh);
  if (!(s > 0)) s = 1;
  var f = $('pvframe');
  f.style.width = w + 'px'; f.style.height = hh + 'px';
  f.style.transform = 'scale(' + s + ') translate(-50%,-50%)';
  var sc = $('pvScale');
  if (s < 0.995) { sc.textContent = T('scale_shrunk', { p: Math.round(s * 100) }); sc.classList.add('on'); }
  else { sc.textContent = ''; sc.classList.remove('on'); }
}
/* プレビューのステージ (背景は暗い色で固定) */
function applyStage() {
  var st = $('stage');
  st.classList.add('bg-dark');
  st.classList.toggle('showframe', showFrame);
  save();
}

/* ---------- 試し表示 (カードにマウスを乗せている間だけ、プレビューに別のデザインを出す) ---------- */
function trialQuery(id) {

  c.d = id; c.c1 = c.c2 = c.c3 = ''; c.font = '';   // 色・フォントはそのデザインの既定、ほかは今のまま
  return CS.serialize(CS.effective(c));
}
function startTrial(id) {
  if (id === cfg.d || CS.isLocked(id) || !CS.design(id)) { endTrial(); return; }
  if (trialId === id) return;
  trialId = id; trialMeasured = null;
  sendConfig(trialQuery(id));
  var tag = $('trialTag');
  tag.textContent = '';
  tag.appendChild(document.createTextNode(T('trial_prefix')));
  tag.appendChild(h('b', { text: dName(CS.design(id)) }));

      ctimer = setTimeout(function () { copyLabel(false); idleMsg(); }, 6000);
      showCredit();
    } else {

      $('obsbar').classList.add('copyfail');

    }
    /* はじめてコピーしたときだけ、OBS への入れ方を自動で開く */
    if (ok && !lsGet(K_COPIED)) { lsSet(K_COPIED, '1'); openHowto(true); }
  });

function openImport() {
  var t = $('impText'), m = $('impMsg');
  t.value = ''; t.removeAttribute('aria-invalid');   /* 開くたびに前の入力とエラーを消す */

/* 貼られた文字から時計の設定 (クエリ文字列) を取り出す。時計の URL でなければ null
 *   受け付けるのは: ? の前が clock.html で終わり、かつ ? の後ろに既知のキーが 1 つ以上ある (または ? がなく既定値のまま) もの */
function importQuery(s) {
  var base = s.split(/[?#]/)[0];
  if (!/clock\.html$/i.test(base)) return null;
  var qi = s.indexOf('?'), q = qi < 0 ? '' : s.slice(qi + 1).split('#')[0];
  if (!q) return '';
  var known = q.split('&').some(function (p) {
    var k = p.split('=')[0];
    try { k = decodeURIComponent(k); } catch (e) { return false; }
    return k !== '' && D.hasOwnProperty(k);
  });
  return known ? q : null;
}
function rawParam(q, key) {
  var ps = q.split('&');
  for (var i = 0; i < ps.length; i++) {
    var eq = ps[i].indexOf('='), k = eq < 0 ? ps[i] : ps[i].slice(0, eq);
    try { if (decodeURIComponent(k) === key) return decodeURIComponent((eq < 0 ? '' : ps[i].slice(eq + 1)).replace(/\+/g, ' ')); } catch (e) {}
  }
  return '';
}
function designName(id) {
  var d = CS.design(id);
  if (d) return dName(d);
  var l = (CS.LOCKED_PREVIEW || []).filter(function (x) { return x.id === id; })[0];
  return l ? dName(l) : '';
}
function buildImport() {
  var host = $('importIn');
  backdropClose($('dlgImport'));
  host.appendChild(h('h3', { id: 'impTitle', text: T('import_title') }));
  host.appendChild(h('p', { style: 'margin:0 0 10px', text: T('import_body') }));
  var imp = h('textarea', { id: 'impText', placeholder: T('import_placeholder'), 'aria-label': T('import_aria') });
  var msg = h('div', { class: 'msg', role: 'status', id: 'impMsg' });
  var go = h('button', { class: 'btn primary', type: 'button', text: T('import_go') });
  function ng(t) { msg.className = 'msg ng'; msg.textContent = t; imp.setAttribute('aria-invalid', 'true'); }
  go.addEventListener('click', function () {
    var s = imp.value.trim();
    if (!s) { ng(T('import_empty')); return; }
    var q = importQuery(s);
    if (q === null) { ng(T('import_bad')); return; }
    endTrial(true);
    var prev = {};
    for (var k in cfg) if (cfg.hasOwnProperty(k)) prev[k] = cfg[k];
    var parsed = CS.parse(q); delete parsed.t; delete parsed.moon;
    var next = tidy(CS.parse(q));
    /* 無料版: 使えないデザイン・有料版の設定は外して読み込み、知らせる */
    var rawD = rawParam(q, 'd'), note = '';
    if (FREE) {
      var dropped = ['c1', 'c2', 'c3', 'font', 'ol', 'anim'].some(function (k) { return String(parsed[k]) !== String(next[k]) && !(k === 'font' && CS.design(next.d) && parsed.font === CS.design(next.d).font); });
      if (rawD && rawD !== next.d) note = T('import_paid_design', { name: designName(rawD) || rawD, fallback: designName(next.d) }) + (dropped ? T('import_paid_dropped_suffix') : '');
      else if (dropped) note = T('import_dropped');
    }
    cfg = next;
    changed();
    imp.value = ''; msg.textContent = ''; msg.className = 'msg'; imp.removeAttribute('aria-invalid');
    closeDlg($('dlgImport'));
    revealCard(cfg.d);
    toast(note || T('import_done'), { label: T('import_undo'), fn: function () {
      endTrial(true);
      cfg = prev;
      changed();
      revealCard(cfg.d);
      toast(T('import_undone'));
    } });
  });
  imp.addEventListener('input', function () { if (msg.className === 'msg ng') { msg.className = 'msg'; msg.textContent = ''; imp.removeAttribute('aria-invalid'); } });
  host.appendChild(imp);
  host.appendChild(msg);
  host.appendChild(h('div', { class: 'acts' }, [h('button', { class: 'btn', type: 'button', text: T('cancel'), onclick: function () { closeDlg($('dlgImport')); } }), go]));
}
